[package]
name = "og-param"
version = "0.1.0"
edition = "2024"
exclude = ["repos/**"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.46", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
